#cloud-config
# Reference Docker host (issue #1). __PLUGIN_TAG__ and __MGMT_ADDR__ are
# substituted by scripts/up-cell.sh from lab.yaml via `labctl resolve`.
hostname: lab-docker-host
manage_etc_hosts: true
users:
  - name: lab
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - __SSH_PUBKEY__
package_update: true
packages:
  - ca-certificates
  - curl
runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >-
    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/debian trixie stable" >
    /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io
  - systemctl enable --now docker
  - docker plugin install --grant-all-permissions --alias net-dhcp-under-test __PLUGIN_TAG__
  - touch /var/lib/cloud/lab-bootstrap-done
