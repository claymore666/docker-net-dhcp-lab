name: verify
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: fetch dev for the attribution check's diff range
        run: git fetch origin dev:refs/remotes/origin/dev || true
      - name: verify
        run: ./verify.sh
