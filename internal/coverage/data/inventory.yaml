# Hand-kept (issue #35). One entry per docs row of the pinned reference; the check in
# internal/coverage fails when a row, a token or a review hash disagrees.
options:
  "network:mode":
    reviewed: "710460643371"
    no_written_default: true
    mode_path: per-mode
    values:
      - {v: "bridge", class: default, modes: ["bridge"]}
      - {v: "macvlan", class: allowed, modes: ["macvlan"]}
      - {v: "ipvlan", class: allowed, modes: ["ipvlan"]}
      - {v: "bogus", class: refused, no_token: true}
    not_values: ["macvlan_mode", "ipvlan_mode"]
  "network:bridge":
    reviewed: "fdb16ee19ead"
    no_written_default: true
    mode_path: per-mode
    values:
      - {v: "br0", class: default, modes: ["bridge"], no_token: true, matches: "*(required)*"}
  "network:parent":
    reviewed: "30888219b4b4"
    no_written_default: true
    mode_path: per-mode
    values:
      - {v: "unset", class: default, modes: ["bridge"], no_token: true, matches: "*(required)* in macvlan and ipvlan; unset in bridge"}
      - {v: "eth0", class: allowed}
    not_values: ["ens18", "UP", "bridge"]
  "network:macvlan_mode":
    reviewed: "7b5ad550caeb"
    mode_path: per-mode
    values:
      - {v: "bridge", class: default}
      - {v: "vepa", class: allowed}
      - {v: "private", class: allowed}
      # The docs name passthru beside require_mac=true, and refuse it. (#35)
      - {v: "passthru", class: allowed, partner: true, refuses_with: ["require_mac=true"]}
      - {v: "bogus", class: refused, no_token: true}
    not_values: ["--mac-address", "require_mac=true", "docker network create"]
  "network:ipvlan_mode":
    reviewed: "033b5b0c2fb2"
    mode_path: per-mode
    values:
      - {v: "l2", class: default}
      - {v: "l3", class: refused}
      - {v: "l3s", class: refused}
    not_values: ["docker network create"]
  "network:vlan":
    reviewed: "2392868c479a"
    mode_path: per-mode
    values:
      - {v: "unset", class: default, no_token: true}
      - {v: "1", class: boundary, no_token: true}
      - {v: "4094", class: boundary, no_token: true}
      - {v: "4095", class: refused, no_token: true}
    not_values: ["<parent>.<id>"]
  "network:gateway":
    reviewed: "9753163e6b8e"
    families: ["routes"]
    mode_path: per-mode
    values:
      - {v: "unset", class: default, no_token: true, matches: "from DHCP"}
      - {v: "192.0.2.1", class: allowed, no_token: true}
      # The docs' example of a refused prefix length is accounted for by
      # its shape, so no address is written here. (#35)
      - {v: "192.0.2.1/24", class: refused, no_token: true, token_kind: ipv4-prefix-length}
      - {v: "2001:db8::1", class: refused, no_token: true}
      - {v: "0.0.0.0", class: refused, no_token: true}
      - {v: "127.0.0.1", class: refused, no_token: true}
      - {v: "224.0.0.1", class: refused, no_token: true}
      - {v: "255.255.255.255", class: refused, no_token: true}
    not_values: ["docker network create"]
  "network:ipv6":
    reviewed: "cbcd48540434"
    no_written_default: true
    mode_path: per-mode
    values:
      # The docs refuse ipv6=false written beside an IPv6 mode, and
      # ipv6=true beside ipv6_mode=off. (#35)
      - {v: "false", class: default, no_token: true, tokens: ["ipv6=false"], refuses_with: ["ipv6_mode=dhcp", "ipv6_mode=slaac", "ipv6_mode=auto"]}
      - {v: "true", class: allowed, no_token: true, tokens: ["ipv6=true"], refuses_with: ["ipv6_mode=off"]}
    not_values: ["GlobalIPv6Address", "/128", "ipv6_mode=dhcp", "ipv6_mode=off", "docker network create", "slaac", "auto", "ipv6_mode"]
  "network:ipv6_mode":
    reviewed: "bd542a8ce046"
    families: ["ipv6", "routes"]
    mode_path: per-mode
    values:
      - {v: "off", class: default}
      - {v: "dhcp", class: allowed, tokens: ["ipv6_mode=dhcp"]}
      - {v: "slaac", class: allowed, refused_modes: ["ipvlan"]}
      - {v: "auto", class: allowed, refused_modes: ["ipvlan"]}
      - {v: "bogus", class: refused, no_token: true}
    not_values: ["ipv6=true", "docker network create", "dhcpv6_auto_fallbacks", "-o ipv6_auto_strict=true", "DHCPV6_ABSENCE_MEMORY", "10m", "0", "dhcpv6_absence_remembered", "ipv6_auto_strict=true", "mode=ipvlan", "-o ipv6=...", "preferred_ipv6", "preferred_lft 0", "ip -6 addr show", "CreateEndpoint", "valid_lft forever preferred_lft forever", "ipv6_slaac_addresses", "ipv6_addresses_withdrawn", "ipv6_slaac_prefixes_ignored", "ipv6_main_prefix", "AddressIPv6", "docker inspect"]
  "network:ipv6_main_prefix":
