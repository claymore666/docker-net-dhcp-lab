# Spellings the docs say mean the same thing. The first member is the
# canonical one; every other member is generated against it. (#35)
alias_groups:
  - name: "ipv6-on"
    modes: ["bridge", "macvlan", "ipvlan"]
    runtime: true
    members: ["ipv6=true", "ipv6_mode=dhcp", "ipv6=true+ipv6_mode=dhcp"]
  - name: "ipv6-off"
    modes: ["bridge", "macvlan", "ipvlan"]
    members: ["ipv6=unset", "ipv6=false", "ipv6_mode=off", "ipv6=false+ipv6_mode=off"]
  - name: "lease-timeout-zero"
    free: true
    members: ["lease_timeout=unset", "lease_timeout=0"]
  - name: "endpoint-ip-run-flag"
    modes: ["bridge", "macvlan", "ipvlan"]
    free: true
    members: ["ip=192.0.2.50", "ip=run-ip"]
  - name: "endpoint-ifname-compose-key"
    modes: ["bridge", "macvlan", "ipvlan"]
    free: true
    members: ["ifname=eth5", "ifname=interface_name"]

# The spellings the environment profiles E1..E4 are crossed with. (#35)
env:
  ipv6: ["ipv6=true", "ipv6_mode=dhcp", "ipv6_mode=slaac", "ipv6_mode=auto"]
  routes: ["skip_routes=true", "skip_routes=false"]
