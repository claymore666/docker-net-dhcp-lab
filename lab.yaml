# Cell declarations for the lab controller (labctl). Every address here
# stays inside 10.200.0.0/16 (IPv4) or the ULA /48 below (RFC 4193): both
# are ours to publish. No cell may declare a subnet outside these ranges;
# `labctl validate` refuses one that does (issue #1).
management:
  # Nested VMs reach the internet through this libvirt network only, for
  # apt and image pulls. No DHCP server runs on it: the address below is
  # rendered into each VM's cloud-init network-config instead.
  libvirt_network: net-mgmt
  subnet: 10.200.255.0/24
  gateway: 10.200.255.1

ula_prefix: "fd42:200::/48"

cells:
  - name: ref-only
    description: >
      Reference Docker host with no IP source: proves the bring-up path,
      the segment bridge and the observer capture. Issue #1.
    segment:
      bridge: lab-br-ref-only
      subnet: 10.200.0.0/24
    source: null
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.10/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: kea
    description: >
      Kea 2.6, apt install, stock config plus a pool. Issue #2.
    segment:
      bridge: lab-br-kea
      subnet: 10.200.1.0/24
    source:
      type: kea
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.21/24
      seg_address: 10.200.1.2/24
      pool_start: 10.200.1.100
      pool_end: 10.200.1.200
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.20/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: isc-dhcp
    description: >
      ISC dhcpd 4.4, apt install, stock config plus a pool. Issue #2.
    segment:
      bridge: lab-br-isc-dhcp
      subnet: 10.200.2.0/24
    source:
      type: isc-dhcp
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.31/24
      seg_address: 10.200.2.2/24
      pool_start: 10.200.2.100
      pool_end: 10.200.2.200
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.30/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: dnsmasq
    description: >
      dnsmasq 2.91, apt install, default config plus a pool. Issue #2.
    segment:
      bridge: lab-br-dnsmasq
      subnet: 10.200.3.0/24
    source:
      type: dnsmasq
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.41/24
      seg_address: 10.200.3.2/24
      pool_start: 10.200.3.100
      pool_end: 10.200.3.200
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.40/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: host-ubuntu2404
    description: >
      Kea, same as the kea cell above, but the Docker host is Ubuntu
      24.04 instead of the reference Debian 13. Issue #8.
    segment:
      bridge: lab-br-host-ubuntu2404
      subnet: 10.200.4.0/24
    source:
      type: kea
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.51/24
      seg_address: 10.200.4.2/24
      pool_start: 10.200.4.100
      pool_end: 10.200.4.200
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: ubuntu-24.04-server-cloudimg-amd64
      mgmt_address: 10.200.255.50/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: host-debian11-docker2010
    description: >
      Kea, same as the kea cell above, but the Docker host is Debian 11
      with docker-ce pinned to the plugin's oldest supported engine,
      20.10. Issue #8.
    segment:
      bridge: lab-br-host-debian11-docker2010
      subnet: 10.200.5.0/24
    source:
      type: kea
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.61/24
      seg_address: 10.200.5.2/24
      pool_start: 10.200.5.100
      pool_end: 10.200.5.200
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: debian-11-generic-amd64
      mgmt_address: 10.200.255.60/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.3.0-rc1
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.2.3
      engine_version: "5:20.10.24~3-0~debian-bullseye"
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8
