# Cell declarations for the lab controller (labctl). Every address here
# stays inside 10.200.0.0/16 (IPv4) or the ULA /48 below (RFC 4193): both
# are ours to publish. No cell may declare a subnet outside these ranges;
# `labctl validate` refuses one that does (issue #1).
management:
  # Nested VMs reach the internet through this libvirt network only, for
  # apt and image pulls. No DHCP server runs on it: the address below is
  # rendered into each VM's cloud-init network-config instead.
  libvirt_network: net-mgmt
  subnet: 10.200.255.0/24
  gateway: 10.200.255.1

ula_prefix: "fd42:200::/48"

cells:
  - name: ref-only
    description: >
      Reference Docker host with no IP source: proves the bring-up path,
      the segment bridge and the observer capture. Issue #1.
    segment:
      bridge: lab-br-ref-only
      subnet: 10.200.0.0/24
      subnet6: "fd42:200:0:0::/64"
    source: null
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.10/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.5.0
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.4.0
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: kea
    description: >
      Kea 2.6, apt install, stock config plus a pool. Issue #2.
    segment:
      bridge: lab-br-kea
      subnet: 10.200.1.0/24
      subnet6: "fd42:200:0:100::/64"
    source:
      type: kea
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.21/24
      seg_address: 10.200.1.2/24
      pool_start: 10.200.1.100
      pool_end: 10.200.1.200
      seg_address6: "fd42:200:0:100::2/64"
      pool6_start: "fd42:200:0:100::100"
      pool6_end: "fd42:200:0:100::1ff"
      temp6_pool: "fd42:200:0:100::200/120"
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.20/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.5.0
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.4.0
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

  - name: kea-ha
    description: >
      Kea 2.6 hot-standby pair: the kea cell's server twice, the HA hook
      on the segment, primary and standby. Issue #12.
    segment:
      bridge: lab-br-kea-ha
      subnet: 10.200.8.0/24
      subnet6: "fd42:200:0:800::/64"
    source:
      type: kea
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.91/24
      seg_address: 10.200.8.2/24
      # From .80, not .100: the pair runs group D and the C5 family on
      # one pool (scenario.PoolDemand, #23 group D part 2).
      pool_start: 10.200.8.80
      pool_end: 10.200.8.200
      seg_address6: "fd42:200:0:800::2/64"
      pool6_start: "fd42:200:0:800::100"
      pool6_end: "fd42:200:0:800::1ff"
      temp6_pool: "fd42:200:0:800::200/120"
      vcpus: 1
      memory_mib: 1024
      disk_gib: 6
      partner:
        mgmt_address: 10.200.255.92/24
        seg_address: 10.200.8.3/24
        seg_address6: "fd42:200:0:800::3/64"
    docker_host:
      base_image: debian-13-generic-amd64
      mgmt_address: 10.200.255.90/24
      plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.5.0
      previous_plugin_tag: ghcr.io/claymore666/docker-net-dhcp:v2.4.0
      vcpus: 2
      memory_mib: 2048
      disk_gib: 8

